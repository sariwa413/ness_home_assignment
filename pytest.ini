[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --html=artifacts/report.html
    --self-contained-html
    --junitxml=artifacts/junit.xml
    --alluredir=artifacts/allure-results
markers =
    e2e: browser driven end-to-end scenario
    unit: fast offline test, no browser
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
