[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --alluredir=artifacts/allure-results
    --clean-alluredir
markers =
    e2e: browser driven end-to-end scenario against the live site
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
